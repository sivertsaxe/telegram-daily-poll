name: Daily Telegram Poll

on:
  schedule:
    - cron: '0 9 * * *'
      timezone: 'Europe/Berlin'
    - cron: '17 * * * *'
      timezone: 'Europe/Berlin'
  workflow_dispatch:
    inputs:
      mode:
        description: 'poll sends at 09:00 local only; auto collects/reports'
        type: choice
        options: [collect, auto, report, poll]
        default: collect

permissions:
  contents: write

concurrency:
  group: telegram-bot-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest -v
      - run: python bot.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
          GH_TOKEN: ${{ github.token }}
          BOT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '0 9 * * *' && 'poll' || 'auto') }}
