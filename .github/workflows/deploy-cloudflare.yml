name: Deploy Cloudflare bot
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [stage, activate, update, deactivate]
        default: stage
        description: Stage imports without consuming Telegram updates; activate only after retiring old schedules
      worker_url:
        type: string
        required: false
        description: HTTPS workers.dev origin shown by Cloudflare (no trailing slash)
      previous_scheduler_stopped:
        type: boolean
        default: false
        description: Both old schedules retired and all old runs finished (required for activation)
permissions:
  contents: read
concurrency:
  group: telegram-bot-state
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare
    env:
      CLOUDFLARE_ACCOUNT_ID: 2e9485cf74f7597aaf76b7ef4151eb0e
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: 'false'
      WORKER_URL: ${{ inputs.worker_url }}
      OPERATION: ${{ inputs.operation }}
      PREVIOUS_SCHEDULER_STOPPED: ${{ inputs.previous_scheduler_stopped }}
      STATE_KEY: ${{ secrets.STATE_KEY }}
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Deploy code and encrypted secrets
        if: inputs.operation == 'stage' || inputs.operation == 'update'
        run: |
          npx --no-install wrangler deploy
          node scripts/secrets.mjs
      - name: Import latest encrypted state (inactive worker only)
        if: (inputs.operation == 'stage' && inputs.worker_url != '') || inputs.operation == 'activate'
        run: node scripts/manage.mjs import "$WORKER_URL"
      - name: Check Telegram without consuming updates or sending messages
        if: inputs.operation != 'deactivate' && inputs.worker_url != ''
        run: node scripts/manage.mjs check "$WORKER_URL"
      - name: Activate new scheduler
        if: inputs.operation == 'activate'
        run: node scripts/manage.mjs activate "$WORKER_URL"
      - name: Deactivate worker
        if: inputs.operation == 'deactivate'
        run: node scripts/manage.mjs deactivate "$WORKER_URL"
      - if: inputs.worker_url != ''
        run: node scripts/manage.mjs health "$WORKER_URL"
